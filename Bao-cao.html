:root{color-scheme:dark;
  --n950:#030A1F;--n900:#051433;--n800:#0A2152;--n700:#143478;
  --b500:#2F7BFF;--b400:#4F93FF;--b300:#7FB4FF;--b200:#B3D2FF;--b100:#D9E9FF;
  --cyan:#5EE7FF;--amber:#FFC46B;--text:#FFFFFF;--muted:#E6EEFF;--dim:#B4C4E6;
  --line:rgba(127,180,255,.26);--line2:rgba(127,180,255,.6);
  --panel:rgba(9,28,74,.8);--panel2:rgba(4,14,42,.72);--card:#0C2760;--cardh:#11307A;
  --live:#3BE68F;--fix:#B99EFF;--test:#FFC94D;--pre:#AEB6CF;--dig:#5CB8FF;
  --chem:#2F7BFF;--filler:#5EE7FF;--gcc:#8B6CFF;--may:#FFC46B;--resin:#22C55E;
  --log:#FF8A5B;--kt:#7FB4FF;--hcns:#FF7EB6;--mkt:#B8E05A;--ww:#5EE7FF;
  --lfX:#5EE7FF;--lfC:#FF8A5B;--lfN:#FFC46B;--lfD:#A78BFF;--bad:#FF6B6B;--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme="light"]{color-scheme:light;
  --n950:#E9EEF8;--n900:#F4F7FC;--n800:#FFFFFF;--n700:#E5E7EB;
  --text:#111827;--muted:#4B5563;--dim:#6B7280;--line:#E5E7EB;--line2:#C7D2E5;
  --panel:#FFFFFF;--panel2:#F9FAFB;--card:#FFFFFF;--cardh:#F3F6FD;
  --cyan:#0284C7;--amber:#B45309;--live:#16A34A;--fix:#7C3AED;--test:#D97706;--pre:#6B7280;--dig:#2563EB;
  --chem:#2563EB;--filler:#0891B2;--gcc:#7C3AED;--may:#D97706;--resin:#16A34A;--log:#EA580C;--kt:#3B82F6;--hcns:#DB2777;--mkt:#65A30D;--ww:#0891B2;--bad:#DC2626;--lfX:#0284C7;--lfC:#EA580C;--lfN:#CA8A04;--lfD:#7C3AED}
*{box-sizing:border-box}
body{margin:0;background:var(--n900);color:var(--text);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:"Be Vietnam Pro",Inter,"Segoe UI",system-ui,sans-serif}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 600px at 0% 0%,rgba(47,123,255,.28),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(94,231,255,.10),transparent 60%)}
:root[data-theme="light"] .glow{background:radial-gradient(900px 600px at 0% 0%,rgba(47,123,255,.10),transparent 60%)}
#app{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:28px 28px 90px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:600}
.top h1{margin:6px 0 0;font-size:34px;line-height:1.3;font-weight:800;letter-spacing:-.01em}
.top h1 em{font-style:normal;display:inline-block;padding:.18em .04em .06em;margin:-.18em 0 -.06em;line-height:1.15;background:linear-gradient(90deg,var(--cyan),var(--b500));-webkit-background-clip:text;background-clip:text;color:transparent}
.top .meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.ibtn{font:inherit;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;transition:all .2s var(--ease)}
.ibtn:hover{color:var(--text);border-color:var(--line2)}
nav.tabs{display:flex;gap:6px;margin:22px 0 18px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow-x:auto;backdrop-filter:blur(8px)}
nav.tabs button{flex:1 0 auto;font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:11px;padding:10px 16px;cursor:pointer;white-space:nowrap;transition:all .2s var(--ease)}
nav.tabs button b{font-family:"Be Vietnam Pro";color:var(--dim);margin-right:6px;font-weight:700}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected="true"]{color:var(--n950);background:linear-gradient(90deg,var(--cyan),var(--b400));box-shadow:0 6px 24px rgba(47,123,255,.35)}
nav.tabs button[aria-selected="true"] b{color:var(--n800)}
:root[data-theme="light"] nav.tabs button[aria-selected="true"]{color:#fff}
:root[data-theme="light"] nav.tabs button[aria-selected="true"] b{color:#E0F2FE}
section.page{animation:in .5s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.h2{font-size:20px;font-weight:700;margin:0}
.h2 em{font-style:normal;color:var(--cyan)}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0;backdrop-filter:blur(8px)}
.panel h3{margin:0 0 2px;font-size:15px;font-weight:700}
.panel .cap{font-size:12px;color:var(--muted);margin:0 0 12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mt{margin-top:16px}
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:28px;align-items:center;padding:26px 28px;border-radius:22px;border:1px solid rgba(255,196,107,.45);background:linear-gradient(135deg,rgba(20,52,120,.75),rgba(5,20,51,.6));position:relative;overflow:hidden}
:root[data-theme="light"] .hero{background:#fff}
.hero:after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,196,107,.18),transparent 65%);animation:pulse 8s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
.hero .lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);font-weight:700}
.big{font-family:"Be Vietnam Pro";font-size:84px;font-weight:800;line-height:1.1;padding-top:.06em;margin:6px 0 4px;letter-spacing:-.03em}
.big small{font-size:20px;font-weight:600;color:var(--muted);margin-left:8px;letter-spacing:0}
.hero .note{color:var(--b200);font-size:13px}
:root[data-theme="light"] .hero .note{color:var(--muted)}
.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;position:relative;z-index:1}
.tl div{border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;font-size:11px;color:var(--muted);background:var(--panel2)}
.tl div b{display:block;font-family:"Be Vietnam Pro";font-size:12.5px;color:var(--text);margin-bottom:2px}
.tl .past{opacity:.55}
.tl .now{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(94,231,255,.25);color:var(--text)}
.tl .gl{border-color:var(--amber);background:rgba(255,196,107,.12)}
.tl .gl b{color:var(--amber)}
.prog{margin-top:16px;position:relative;z-index:1}
.prog .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.prog .row b{color:var(--text);font-family:"Be Vietnam Pro"}
.stack{height:14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);display:flex;overflow:hidden}
.stack i{display:block;height:100%;transition:width .6s var(--ease)}
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--b400))}
.kpi b{display:block;font-family:"Be Vietnam Pro";font-size:32px;font-weight:800;line-height:1.1;color:var(--c,var(--text))}
.kpi span{font-size:12px;color:var(--muted)}
.ins{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;align-items:start}
.tg{font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:6px;white-space:nowrap;font-family:"Be Vietnam Pro"}
.tg.n{background:rgba(94,231,255,.15);color:var(--cyan);border:1px solid rgba(94,231,255,.45)}
.tg.a{background:rgba(255,196,107,.15);color:var(--amber);border:1px solid rgba(255,196,107,.45)}
.ringwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:160px}
.legend li{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.legend li b{margin-left:auto;font-family:"Be Vietnam Pro"}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.bars .br{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12.5px;padding:5px 0}
.bars .br .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .br .nm i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.bars .br .v{text-align:right;font-family:"Be Vietnam Pro";font-weight:700}
.bars .sep{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:10px 0 2px;font-weight:600}
.star{color:var(--amber)}
.chart svg{width:100%;height:auto;display:block}
.hm{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr)) minmax(0,.8fr);gap:6px;font-size:12px;align-items:center}
.hm .hd{font-size:10.5px;color:var(--muted);text-align:center}
.hm .c{border-radius:8px;padding:6px 4px;text-align:center;font-weight:600;font-size:11px;border:1px solid var(--line)}
.c.h0,.c.d0{color:var(--muted)}
.c.h1{background:rgba(255,196,107,.16);color:var(--amber);border-color:rgba(255,196,107,.4)}
.c.h2,.c.d1{background:rgba(34,197,94,.18);color:var(--live);border-color:rgba(34,197,94,.45)}
.lchain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lchain>div{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.lchain b{display:block;font-family:"Be Vietnam Pro";font-size:24px}
.lchain span{font-size:11.5px;color:var(--muted)}
.legend-row{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:10px 0 14px;align-items:center}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.flowscroll{overflow-x:auto;padding-bottom:8px}
.flow{position:relative;min-width:1340px;padding:0 0 0 26px}
.rowh{font-family:"Be Vietnam Pro";font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 10px;display:flex;align-items:center;gap:10px}
.rowh:after{content:"";flex:1;height:1px;background:var(--line)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:30px;align-items:start;position:relative;z-index:2}
.board.fn{grid-template-columns:repeat(4,minmax(0,1fr))}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:0 12px 12px;min-width:0;backdrop-filter:blur(6px)}
.lhead{margin:0 -12px 10px;padding:12px 14px;border-radius:17px 17px 0 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--lc) 34%,#0A2152),color-mix(in srgb,var(--lc) 12%,#0A2152));border-top:4px solid var(--lc);color:#fff}
.lhead h3 .st{color:var(--lc)}
.lhead h3{margin:0;font-size:16px;font-weight:700}
.lhead p{margin:2px 0 0;font-size:11px;opacity:.9}
.lhead .cnt{font-family:"Be Vietnam Pro";font-weight:800;font-size:12px;background:var(--lc);color:#03142E;padding:3px 10px;border-radius:999px;white-space:nowrap}
.dc{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:10.5px;font-weight:700;padding:2px 8px 2px 6px;border-radius:999px;background:rgba(3,10,31,.55);color:#fff}
.dc i{width:7px;height:7px;border-radius:50%;background:#FF6B6B}
.dc.on i{background:#22C55E;box-shadow:0 0 8px #22C55E}
.sg{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 2px 7px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 13px;margin-bottom:8px;transition:transform .2s var(--ease),border-color .2s var(--ease),opacity .3s var(--ease),background .2s}
.card:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--sc,var(--line2))}
.card:hover{transform:translateY(-2px);border-color:var(--line2);background:var(--cardh)}
.card .cd{display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--muted);font-weight:600}
.card .nm{font-size:12.5px;font-weight:600;margin:2px 0 4px;line-height:1.35}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-dig{--sc:var(--dig)} .chip.s-dig{color:var(--dig)} select.ds.s-dig{background:color-mix(in srgb,var(--dig) 20%,var(--card));border-color:color-mix(in srgb,var(--dig) 60%,transparent);color:var(--dig)}
.s-live{--sc:var(--live)} .s-fix{--sc:var(--fix)} .s-test{--sc:var(--test)} .s-pre{--sc:var(--pre)}
.chip.s-live{color:var(--live)} .chip.s-fix{color:var(--fix)} .chip.s-test{color:var(--test)} .chip.s-pre{color:var(--pre)} .chip.s-none{color:var(--dim);border-style:dashed}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:5px;border:1px solid}
.tag.log{color:var(--log);border-color:color-mix(in srgb,var(--log) 55%,transparent);background:color-mix(in srgb,var(--log) 12%,transparent)}
.tag.src{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 50%,transparent)}
.hof{margin-top:8px;border:1px dashed var(--line2);border-radius:12px;padding:8px 10px;font-size:11.5px;color:var(--muted)}
.hof b{color:var(--cyan);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.logband{position:relative;z-index:2;margin:52px 0 30px;border:1.5px dashed color-mix(in srgb,var(--log) 70%,transparent);border-radius:18px;padding:14px 16px;background:color-mix(in srgb,var(--log) 6%,var(--panel))}
.logband .bh{margin-bottom:12px}
.logband h3{margin:0;font-size:16px;color:var(--log)}
.logband p{margin:0;font-size:12px;color:var(--muted)}
.lnodes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px}
.lnode{border:1px solid color-mix(in srgb,var(--lc) 60%,transparent);background:color-mix(in srgb,var(--lc) 10%,var(--card));border-radius:14px;padding:10px 12px;transition:all .2s var(--ease)}
.lnode:hover,.lnode.hl{box-shadow:0 0 0 1px var(--lc),0 0 22px color-mix(in srgb,var(--lc) 35%,transparent)}
.lnode b{font-family:"Be Vietnam Pro";font-size:14px;color:var(--lc)}
.lnode .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.lnode .stack{height:6px;margin-top:8px}
svg.wires{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}
svg.wires path{fill:none;stroke-width:1.6;opacity:.6;transition:opacity .25s var(--ease),stroke-width .25s}
svg.wires path{stroke-dasharray:4 7;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
svg.wires.focus path,svg.wires.focus circle{opacity:.07}
svg.wires.focus path.on,svg.wires.focus circle.on{opacity:1;stroke-width:2.6}
.flow.focus .card[data-log]:not(.on){opacity:.45}
.card[data-log]{cursor:pointer}
.card.on{border-color:var(--log);box-shadow:0 0 0 1px var(--log)}
.ww .desc{font-size:11px;color:var(--muted);margin-bottom:5px}
.fbar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.fbar button{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;transition:all .2s var(--ease)}
.fbar button[aria-pressed="true"]{color:var(--text);border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.dsum{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.dsum b{font-family:"Be Vietnam Pro";color:var(--text)}
.tbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:12px}
.tbox .th{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbox .th h3{margin:0;font-size:15px}
.tbox .th i{width:10px;height:10px;border-radius:50%}
.tbox .th span{font-size:12px;color:var(--muted)}
.tscroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;font-size:12px}
th,td{padding:4px 3px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font-size:10.5px;color:var(--muted);font-weight:600;background:var(--n800)}
:root[data-theme="light"] thead th{background:#F9FAFB}
th.wk{font-family:"Be Vietnam Pro";font-size:10.5px;letter-spacing:.06em;color:var(--b300);border-left:1px solid var(--line)}
td.nmc,th.nmc{text-align:left;position:sticky;left:0;z-index:2;background:var(--n800);min-width:250px;max-width:280px;white-space:normal;padding:6px 10px;border-right:1px solid var(--line)}
:root[data-theme="light"] td.nmc,:root[data-theme="light"] th.nmc{background:#fff}
td.nmc .cd{font-size:10.5px;color:var(--muted);font-weight:600;margin-right:4px}
tr.grp td{text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--panel2);padding:6px 10px}
tr.grp td:first-child{position:sticky;left:0;z-index:2}
.now{background:rgba(94,231,255,.10)!important}
thead th.now{color:var(--cyan)}
.gl{background:rgba(255,196,107,.12)!important}
thead th.gl{color:var(--amber)}
.wkst{border-left:1px solid var(--line)}
select.ds{font:inherit;font-size:11px;font-weight:700;border-radius:8px;padding:4px 2px;width:104px;cursor:pointer;border:1px solid var(--line);color:var(--text);background:var(--card);appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;transition:all .2s var(--ease)}
select.ds:hover{border-color:var(--line2)}
select:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
select.ds.s-live{background:color-mix(in srgb,var(--live) 22%,var(--card));border-color:color-mix(in srgb,var(--live) 60%,transparent);color:var(--live)}
select.ds.s-fix{background:color-mix(in srgb,var(--fix) 22%,var(--card));border-color:color-mix(in srgb,var(--fix) 60%,transparent);color:var(--fix)}
select.ds.s-test{background:color-mix(in srgb,var(--test) 20%,var(--card));border-color:color-mix(in srgb,var(--test) 60%,transparent);color:var(--test)}
select.ds.s-pre{background:color-mix(in srgb,var(--pre) 20%,var(--card));border-color:color-mix(in srgb,var(--pre) 55%,transparent);color:var(--text)}
select.ds.s-none{color:var(--dim)}
select.ds.carry{opacity:.5;font-style:italic;font-weight:500;border-style:dashed}
select.ds option,select.pl option{background:var(--n800);color:var(--text);font-style:normal}
select:disabled{cursor:default}
select.pl{font:inherit;font-size:12px;font-weight:600;border-radius:9px;padding:6px 8px;border:1px solid var(--line);background:var(--card);color:var(--text);min-width:150px;cursor:pointer}
select.pl.h1{border-color:rgba(255,196,107,.6);color:var(--amber)}
select.pl.h2,select.pl.on{border-color:rgba(34,197,94,.6);color:var(--live)}
.rt td,.rt th{padding:10px 12px}
.rt td:first-child,.rt th:first-child{text-align:left}
#handt select.pl{min-width:230px}
.rt .due{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.over{color:#FF6B6B;font-weight:700;font-size:11px}
.info{border-left:3px solid var(--cyan);padding:10px 14px;background:rgba(94,231,255,.06);border-radius:0 12px 12px 0;font-size:12.5px;color:var(--muted);margin-top:12px}
.info b{color:var(--text)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.step .no{font-family:"Be Vietnam Pro";font-size:30px;font-weight:800;color:var(--cyan)}
.step h3{margin:4px 0;font-size:14.5px}
.step p{margin:0;font-size:12.5px;color:var(--muted)}
.qs{counter-reset:q;list-style:none;padding:0;margin:0}
.qs li{counter-increment:q;padding:10px 0 10px 40px;position:relative;border-bottom:1px solid var(--line);font-size:13px}
.qs li:before{content:counter(q);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:8px;background:rgba(255,196,107,.15);color:var(--amber);font-family:"Be Vietnam Pro";font-weight:700;display:grid;place-items:center;font-size:12px}
.savebar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:999px;background:rgba(3,10,31,.88);border:1px solid var(--line2);backdrop-filter:blur(10px);font-size:12.5px;color:var(--b200);box-shadow:0 10px 40px rgba(0,0,0,.45);max-width:calc(100% - 32px)}
:root[data-theme="light"] .savebar{background:rgba(255,255,255,.95);color:var(--muted)}
.savebar .mode{font-weight:700;color:var(--text);white-space:nowrap}
.savebar .msg{overflow:hidden;text-overflow:ellipsis;white-space:normal;line-height:1.3}
.savebar button{font:inherit;font-size:12.5px;font-weight:700;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:linear-gradient(90deg,var(--cyan),var(--b400));color:var(--n950);white-space:nowrap}
:root[data-theme="light"] .savebar button{color:#fff}
.savebar button:disabled{opacity:.35;cursor:default}
.foot{margin-top:26px;font-size:11.5px;color:var(--dim);text-align:center}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){#app{padding:18px 16px 100px}.top h1{font-size:24px}.big{font-size:60px}.kpis{grid-template-columns:repeat(2,1fr)}.tl{grid-template-columns:repeat(4,1fr)}.steps{grid-template-columns:1fr}.lchain{grid-template-columns:repeat(2,1fr)}.bars .br{grid-template-columns:96px minmax(0,1fr) 46px}.hm{font-size:10.5px;grid-template-columns:70px repeat(4,minmax(0,1fr))}}
/* insight callouts */
.ins{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px;padding-top:0;border-top:0;font-size:13px}
.ib{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:12px;border-left:4px solid;line-height:1.5}
.ib.n{background:color-mix(in srgb,var(--cyan) 9%,transparent);border-color:var(--cyan)}
.ib.a{background:color-mix(in srgb,var(--amber) 10%,transparent);border-color:var(--amber)}
.ib .tg{flex:none;margin-top:1px}
.ib b{color:var(--text)}
/* executive summary */
.headline{margin:22px 0 4px;font-size:26px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.headline em{font-style:normal;display:inline-block;padding:.18em .04em .06em;margin:-.18em 0 -.06em;line-height:1.15;background:linear-gradient(90deg,var(--cyan),var(--b500));-webkit-background-clip:text;background-clip:text;color:transparent}
.headline small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px;font-family:Inter,system-ui,sans-serif}
.exec{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:16px;margin-top:14px}
.xc{position:relative;border-radius:20px;padding:20px 22px 18px;background:var(--panel);border:1px solid color-mix(in srgb,var(--xc) 45%,var(--line));overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,var(--xc) 12%,transparent),0 14px 40px color-mix(in srgb,var(--xc) 14%,transparent)}
.xc:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--xc),color-mix(in srgb,var(--xc) 30%,transparent))}
.xc:after{content:"";position:absolute;right:-80px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--xc) 22%,transparent),transparent 70%);pointer-events:none}
.xc .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--xc)}
.lamp{display:inline-flex;align-items:center;gap:10px;margin:10px 0 12px;padding:7px 16px 7px 12px;border-radius:999px;font-weight:800;font-size:17px;font-family:"Be Vietnam Pro",Inter,sans-serif;background:color-mix(in srgb,var(--xc) 16%,transparent);color:var(--xc);border:1px solid color-mix(in srgb,var(--xc) 50%,transparent)}
.lamp i{width:12px;height:12px;border-radius:50%;background:var(--xc);animation:ping 2s var(--ease) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--xc) 70%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.cmp{display:grid;grid-template-columns:118px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:7px}
.cmp b{text-align:right;color:var(--text);font-family:"Be Vietnam Pro",Inter,sans-serif}
.cmp .t{height:10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.cmp .t i{display:block;height:100%;border-radius:999px;transition:width .8s var(--ease)}
.xl{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.xl li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;padding:9px 11px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.xl li .no{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:11.5px;background:color-mix(in srgb,var(--xc) 18%,transparent);color:var(--xc)}
.xl li b{color:var(--text)}
.stack.shine{position:relative}
.stack.shine:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:shine 3.2s var(--ease) infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.rv{opacity:0;transform:translateY(14px)}
.rv.in{opacity:1;transform:none;transition:opacity .55s var(--ease),transform .55s var(--ease)}
/* light theme polish */
:root[data-theme="light"] body{background-color:#F5F8FD;background-image:radial-gradient(rgba(37,99,235,.10) 1px,transparent 1.2px);background-size:22px 22px}
:root[data-theme="light"] .panel,:root[data-theme="light"] .lane,:root[data-theme="light"] .kpi,:root[data-theme="light"] .tbox,:root[data-theme="light"] .step,:root[data-theme="light"] nav.tabs{box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(37,99,235,.07);backdrop-filter:none}
:root[data-theme="light"] .card{box-shadow:0 1px 2px rgba(16,24,40,.05)}
:root[data-theme="light"] .lhead{background:linear-gradient(135deg,var(--lc),color-mix(in srgb,var(--lc) 78%,#fff));border-top:0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18)}
:root[data-theme="light"] .lhead h3 .st{color:#fff}
:root[data-theme="light"] .lhead .cnt{background:rgba(255,255,255,.25);color:#fff}
:root[data-theme="light"] .hero{background:linear-gradient(120deg,#FFFFFF 0%,#EEF4FF 55%,#FFF4E0 100%);border-color:#F5C26B;box-shadow:0 18px 50px rgba(37,99,235,.12)}
:root[data-theme="light"] .big{color:var(--text)}
:root[data-theme="light"] .big small{-webkit-text-fill-color:var(--muted)}
:root[data-theme="light"] .tl div{background:#fff}
:root[data-theme="light"] .xc{background:#fff}
:root[data-theme="light"] .lnode{background:color-mix(in srgb,var(--lc) 8%,#fff)}
:root[data-theme="light"] .logband{background:#FFF7F2}
:root[data-theme="light"] .stack.shine:after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent)}
.board .lhead{min-height:74px}
:root[data-theme="light"] svg.wires path{opacity:.8;stroke-width:1.8}
@media (max-width:1100px){.exec{grid-template-columns:1fr}}
/* daily summary (page 02) */
.dtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 14px}
.mchip{font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--live);color:#03142E}
.mchip.view{background:var(--pre);color:#fff}.mchip.local{background:var(--amber);color:#03142E}
.dhero{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr);gap:26px;align-items:center;padding:22px 26px;border-radius:22px;border:1px solid rgba(255,196,107,.55);background:linear-gradient(135deg,rgba(20,52,120,.8),rgba(5,20,51,.65));box-shadow:0 0 30px rgba(255,196,107,.12);position:relative;overflow:hidden}
.dhero .lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);font-weight:800}
.dhero .dt{font-family:"Be Vietnam Pro",Inter,sans-serif;font-size:40px;font-weight:800;margin:4px 0 0}
.dhero .dt small{font-size:18px;color:var(--muted);font-weight:600;margin-left:12px}
.dhero .cd{display:flex;align-items:baseline;gap:12px;margin-top:6px}
.dhero .cd b{font-family:"Be Vietnam Pro",Inter,sans-serif;font-size:76px;line-height:1;font-weight:800;color:var(--amber)}
.dhero .cd span{font-size:22px;font-weight:700}
.dhero .nt{font-size:13px;color:var(--b200);margin-top:6px}
.dtl{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.dtl div{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:var(--panel2);font-size:11px;color:var(--muted)}
.dtl div:before{content:"";display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 4px;background:var(--b500)}
.dtl b{display:block;font-family:"Be Vietnam Pro",Inter,sans-serif;font-size:14px;color:var(--text)}
.dtl .past{opacity:.55}.dtl .past:before{background:var(--dim)}
.dtl .now{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}.dtl .now:before{background:var(--cyan);box-shadow:0 0 0 4px rgba(94,231,255,.25)}
.dtl .gl{border-color:var(--amber);background:rgba(255,196,107,.12)}.dtl .gl:before{background:var(--amber)}.dtl .gl span{color:var(--amber);font-weight:700}
.dprog{margin-top:14px}
.dprog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--b200)}
.dprog .row b{color:var(--text);font-family:"Be Vietnam Pro",Inter,sans-serif}
.dprog .bar{height:12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);margin:8px 0 6px;overflow:hidden}
.dprog .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--live),var(--amber));transition:width .8s var(--ease)}
.dprog .tg2{font-size:12.5px;color:var(--muted)}
.dcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.dcard .k{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.dcard .v{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
.dcard .v b{font-family:"Be Vietnam Pro",Inter,sans-serif;font-size:44px;font-weight:800;line-height:1.05}
.dcard .v span{font-size:15px;color:var(--muted)}
.dcard p{margin:0;font-size:13px;color:var(--muted)}
.dcard .r{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.dcard .r .t{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden}
.dcard .r .t i{display:block;height:100%;border-radius:999px}
.dcard .r b{text-align:right;font-family:"Be Vietnam Pro",Inter,sans-serif}
.dleg{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--muted);margin:14px 0 4px;align-items:center}
.dleg span{display:inline-flex;align-items:center;gap:6px}
.dleg b{color:var(--text)}
td.cur,th.cur{position:sticky;left:270px;z-index:2;background:var(--n800);min-width:128px;text-align:left;padding-left:10px;border-right:1px solid var(--line)}
td.nmc,th.nmc{width:270px;min-width:270px;max-width:270px}
:root[data-theme="light"] td.cur,:root[data-theme="light"] th.cur{background:#fff}

:root[data-theme="light"] .dhero .nt,:root[data-theme="light"] .dprog .row{color:var(--muted)}
:root[data-theme="light"] .dtl div,:root[data-theme="light"] .dcard{background:#fff}
:root[data-theme="light"] .dcard{box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(37,99,235,.07)}
@media (max-width:1100px){.dhero{grid-template-columns:1fr}.dcards{grid-template-columns:1fr}}
@media (max-width:640px){.dtl{grid-template-columns:repeat(4,1fr)}.dhero .cd b{font-size:56px}.dhero .dt{font-size:30px}}
.dcard.gold{border-color:rgba(255,196,107,.7);box-shadow:0 0 26px rgba(255,196,107,.14);background:linear-gradient(135deg,rgba(20,52,120,.8),rgba(5,20,51,.6))}
.dcard.gold .k{color:var(--amber)} .dcard.gold .v b{color:var(--amber)}

.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini span{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2)}
.mini b{font-family:"Be Vietnam Pro",Inter,sans-serif}

.blk{border-top:4px solid var(--bc)}
.blk .bh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.blk .k{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--bc)}
.blk h3{font-size:19px;margin:2px 0 0}
.blk .bt .big{font-size:14px;color:var(--muted);padding:6px 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--live) 50%,transparent);background:color-mix(in srgb,var(--live) 12%,transparent)}
.blk .bt .big b{font-family:"Be Vietnam Pro",Inter,sans-serif;font-size:18px;color:var(--live)}
.bchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}

.bchips span i{width:8px;height:8px;border-radius:50%;background:var(--cc)}

.mxw{overflow-x:auto}

/* hero countdown emphasis */

.big #days{display:inline-block;padding:.08em .04em 0;background:linear-gradient(180deg,#FFE8A8 0%,#FFC46B 45%,#FF9A3D 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,196,107,.55));animation:daysglow 3.2s ease-in-out infinite}

.big small{font-size:24px;color:#fff;-webkit-text-fill-color:currentColor}
:root[data-theme="light"] .big #days{background:linear-gradient(180deg,#F59E0B 0%,#D97706 55%,#B45309 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 18px rgba(217,119,6,.35))}

@media (max-width:640px){.big{font-size:88px}}
/* CRM view */
table.crt{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:980px;font-size:13px}
.crt thead th{background:none;border:0;text-align:left;font-size:12px;font-weight:800;color:var(--text);padding:4px 10px;white-space:normal;position:static}
.crt thead th .due{display:block;font-size:10.5px;font-weight:500;color:var(--muted)}
.crt td{background:var(--panel2);padding:10px;vertical-align:top;border:0;white-space:normal;text-align:left;width:22%}
.crt tr.sub td.pk{padding-left:24px;font-weight:700}
.crc.none{color:var(--dim)} .crc.none:before{box-shadow:none;opacity:.5}
select.ds.cr.on{background:color-mix(in srgb,var(--cc) 22%,var(--card));border-color:color-mix(in srgb,var(--cc) 60%,transparent);color:var(--cc)}
:root:not([data-theme="light"]) select.ds.cr.on{color:#fff;background:color-mix(in srgb,var(--cc) 30%,#06143A)}
#crmday td.nmc{min-width:200px}
.crt td.pk{width:12%;font-weight:800;border-radius:12px 0 0 12px;vertical-align:middle;white-space:nowrap}
.crt td:last-child{border-radius:0 12px 12px 0}
.crt td .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cev{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.4}
select.crs{font:inherit;font-size:12.5px;font-weight:800;border-radius:999px;padding:6px 12px;cursor:pointer;width:100%;max-width:230px;border:1px solid color-mix(in srgb,var(--cc) 70%,transparent);background:color-mix(in srgb,var(--cc) 16%,var(--card));color:var(--cc)}
select.crs option{background:var(--n800);color:var(--text)}
select.crs:disabled{cursor:default}
.crc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--cc)}
.crc:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cc);box-shadow:0 0 10px var(--cc)}
:root:not([data-theme="light"]) .crt td{background:rgba(4,14,42,.78)}
:root:not([data-theme="light"]) .cev{color:#D7E3FF}
:root:not([data-theme="light"]) select.crs{color:#fff;background:color-mix(in srgb,var(--cc) 28%,#06143A)}
:root[data-theme="light"] .crt td{background:#F6F8FC}
/* LOG map: ribbons from PKD to LOG functions */
.tag.lg{color:var(--lf);border-color:color-mix(in srgb,var(--lf) 55%,transparent);background:color-mix(in srgb,var(--lf) 14%,transparent)}
.lmap-wrap{position:relative;margin:34px 0 30px;border:1px solid color-mix(in srgb,var(--log) 45%,var(--line));border-radius:20px;padding:20px 20px 20px;background:var(--panel);overflow:hidden}
.lmap-wrap:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--lfX),var(--lfC),var(--lfN),var(--lfD))}
.lm-h{margin-bottom:16px}
.lm-h h3{margin:0;font-size:17px;color:var(--log)}
.lm-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted);max-width:820px}
.lmap{display:grid;grid-template-columns:220px minmax(150px,.75fr) minmax(0,2.3fr);position:relative}
.lm-src{display:flex;flex-direction:column;justify-content:space-around;gap:12px;position:relative;z-index:2}
.lm-node{border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--lc) 16%,var(--card));border:1px solid color-mix(in srgb,var(--lc) 55%,transparent);border-left:4px solid var(--lc);transition:opacity .25s var(--ease),box-shadow .25s var(--ease);cursor:default}
.lm-node b{display:block;font-family:"Be Vietnam Pro",Inter,sans-serif;font-size:14px}
.lm-node b i{font-style:normal;color:var(--lc)}
.lm-node span{font-size:11.5px;color:var(--muted)}
.lm-dst{display:grid;gap:12px;position:relative;z-index:2}
.lm-fn{border-radius:14px;padding:10px 12px 12px;background:color-mix(in srgb,var(--lf) 7%,var(--card));border:1px solid color-mix(in srgb,var(--lf) 45%,transparent);border-left:4px solid var(--lf);transition:opacity .25s var(--ease)}
.lm-fn .fh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.lm-fn .fh b{font-family:"Be Vietnam Pro",Inter,sans-serif;font-size:14.5px;color:var(--lf)}
.lm-fn .fh span{font-size:11.5px;color:var(--muted)}
.lm-fn .stack{height:6px;margin:8px 0}
.lm-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lm-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12px;min-width:0;transition:opacity .25s var(--ease),border-color .2s}
.lm-row .pk{flex:none;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--lc) 22%,transparent);color:var(--text);border:1px solid color-mix(in srgb,var(--lc) 60%,transparent)}
.lm-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm-row .nm small{color:var(--muted);font-weight:600;margin-right:4px}
.lm-row .chip{flex:none}
svg.ribbons{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
svg.ribbons .rb{opacity:.42;transition:opacity .25s var(--ease)}
svg.ribbons .fl{fill:none;stroke-width:1.4;stroke-dasharray:2 9;opacity:.9;animation:dash 1.8s linear infinite}
.lmap.focus .rb{opacity:.06} .lmap.focus .fl{opacity:.1}
.lmap.focus .rb.on{opacity:.9} .lmap.focus .fl.on{opacity:1}
.lmap.focus .lm-row:not(.on){opacity:.3}
.lmap.focus .lm-node:not(.on),.lmap.focus .lm-fn:not(.on){opacity:.4}
.lm-row.on{border-color:var(--log)}
.lm-node.on{box-shadow:0 0 0 1px var(--lc),0 0 20px color-mix(in srgb,var(--lc) 35%,transparent)}
:root[data-theme="light"] .lmap-wrap{background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(234,88,12,.08)}
:root[data-theme="light"] .lm-node{background:color-mix(in srgb,var(--lc) 7%,#fff)}
:root[data-theme="light"] .lm-fn{background:color-mix(in srgb,var(--lf) 5%,#fff)}
:root[data-theme="light"] svg.ribbons .rb{opacity:.3}

#daily table,#crmday table{width:100%}

  function drawWires(){

        var fe=$('fn-'+f.k), fr=fe.getBoundingClientRect(), tot=LOGS.filter(function(p){return p.log===f.k;}).length;
        var base=Math.max(fr.top-mr.top+6, fr.top-mr.top+fr.height/2-tot*unit/2);
        var t0=base+(dstUsed[f.k]||0); dstUsed[f.k]=(dstUsed[f.k]||0)+k*unit;
        var tx=fr.left-mr.left, y0=y, y1=y+k*unit, t1=t0+k*unit, cx=(sx+tx)/2;

  function bindWires(){

        '<td><textarea class="fi" id="fb-'+f.id+'-txt" data-fb="'+f.id+'" data-k="txt" maxlength="600" placeholder="Nội dung phản hồi" aria-label="Nội dung phản hồi">'+esc(f.txt)+'</textarea></td>'+
        '<td>'+sel(f,'pri',FBP,f.pri==='hi'?' h1':'')+'</td><td>'+sel(f,'st',FBS,f.st==='done'?' on':'')+'</td>'+
        '<td><input type="text" class="fi" id="fb-'+f.id+'-own" data-fb="'+f.id+'" data-k="own" maxlength="80" value="'+esc(f.own)+'" placeholder="Người phụ trách" aria-label="Người phụ trách"></td>'+
        '<td><textarea class="fi" id="fb-'+f.id+'-note" data-fb="'+f.id+'" data-k="note" maxlength="600" placeholder="Hướng xử lý, kết quả" aria-label="Hướng xử lý">'+esc(f.note)+'</textarea></td>'+
        '<td><button type="button" class="fbdel'+(fbDel===f.id?' sure':'')+'" data-fbdel="'+f.id+'">'+(fbDel===f.id?'Bấm lần nữa để xóa':'Xóa')+'</button></td></tr>'; }).join('');
    $('fbt').innerHTML='<table class="rt fbt"><thead><tr><th style="width:132px">Ngày</th><th style="width:124px">Phòng</th><th style="width:132px">Hạng mục</th><th>Nội dung phản hồi</th><th style="width:118px">Ưu tiên</th><th style="width:138px">Trạng thái</th><th style="width:132px">Phụ trách</th><th>Hướng xử lý</th>'+(ed?'<th style="width:70px"></th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table>';
  }
  function renderFb(){ renderFbSum(); renderFbTable(); }
  $('p-fb').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.fbf){ FBF=b.dataset.fbf; fbDel=''; renderFb(); return; }

    if(b.dataset.fbadd){ var id='f'+Date.now().toString(36); S.fb.push({id:id,d:TODAY,dept:'',area:'qt',txt:'',pri:'mid',st:'new',own:'',note:''}); if(FBF==='closed') FBF='open'; fbDel=''; touch(); renderFb(); var x=$('fb-'+id+'-txt'); if(x) x.focus(); return; }
    if(b.dataset.fbdel){ var d=b.dataset.fbdel; if(fbDel===d){ S.fb=S.fb.filter(function(f){ return f.id!==d; }); fbDel=''; touch(); renderFb(); } else { fbDel=d; renderFbTable(); } }
  });
  $('p-fb').addEventListener('input',function(e){ var t=e.target; if(!t.dataset||!t.dataset.fb||t.tagName==='SELECT'||!editable()) return; var f=S.fb.filter(function(x){ return x.id===t.dataset.fb; })[0]; if(f) f[t.dataset.k]=String(t.value); });
  $('p-fb').addEventListener('change',function(e){ var t=e.target; if(!t.dataset||!t.dataset.fb||!editable()) return;
    var f=S.fb.filter(function(x){ return x.id===t.dataset.fb; })[0]; if(!f) return;
    f[t.dataset.k]=String(t.value).trim(); touch();
    if(t.tagName==='SELECT'){ var id=t.id; renderFb(); var nt=$(id); if(nt) nt.focus({preventScroll:true}); } else renderFbSum(); });
  /* ---------- tabs, theme ---------- */
  var TABS=['dash','flow','crm','hand'];
  function show(t){ if(TABS.indexOf(t)<0) t='dash';
    TABS.forEach(function(x){ $('p-'+x).hidden=(x!==t); });
    each(document.querySelectorAll('nav.tabs button'),function(b){ b.setAttribute('aria-selected',b.dataset.tab===t); });
    try{ sessionStorage.setItem('tld-tab',t); }catch(e){}
    try{ if(location.hash!=='#t-'+t) history.replaceState(null,'','#t-'+t); }catch(e){}
    if(t==='flow') requestAnimationFrame(drawWires);

  }
  document.querySelector('nav.tabs').addEventListener('click',function(e){ var b=e.target.closest('button[data-tab]'); if(b) show(b.dataset.tab); });
  $('hero3').addEventListener('click',function(e){ var b=e.target.closest('[data-go]'); if(b){ show(b.dataset.go); try{ window.scrollTo(0,0); }catch(x){} } });
  function setTheme(t){ document.documentElement.setAttribute('data-theme',t); $('theme').textContent=t==='light'?'Giao diện tối':'Giao diện sáng'; try{ localStorage.setItem('tld-theme2',t); }catch(e){} }
  $('theme').addEventListener('click',function(){ setTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'); if(window.__skyDraw) window.__skyDraw(); });
  var th='light'; try{ th=localStorage.getItem('tld-theme2')||'light'; }catch(e){} setTheme(th);

  function renderAll(){ renderDash(); renderFlow(); renderDaily(); renderCrm(); renderHand(); renderFb(); bar(); }

  (function(){
    var cl=window.claude;

  (function(){
    var cv=$('sky'); if(!cv||!cv.getContext) return; var ctx=cv.getContext('2d'), W=0,H=0, stars=[], dust=[], bokeh=[], meteors=[], T0=Date.now(), nextMeteor=0;
    function rnd(a,b){ return a+Math.random()*(b-a); }
    function size(){ W=cv.width=innerWidth; H=cv.height=innerHeight; var a=W*H;
      stars=[]; for(var i=0;i<Math.min(170,a/9000);i++) stars.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.3,1.5),p:rnd(0,6.28),s:rnd(.6,1.8)});
      dust=[]; for(i=0;i<Math.min(70,a/22000);i++) dust.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.6,2),v:rnd(.15,.5),a:rnd(.25,.7),d:rnd(-.15,.15)});
      bokeh=[]; for(i=0;i<Math.min(26,a/50000);i++) bokeh.push({x:rnd(0,W),y:rnd(0,H),r:rnd(18,70),v:rnd(.08,.3),c:[[47,123,255],[94,231,255],[255,196,107],[124,92,255]][i%4],a:rnd(.05,.12),p:rnd(0,6.28)}); }
    var AUR=[[47,123,255,.22,.15,.2,0],[94,231,255,.14,.85,.25,1.7],[124,92,255,.16,.3,.85,3.1],[34,197,94,.08,.7,.7,4.6]];
    var ORBS=[[47,123,255,.20,.12,.18,0],[94,231,255,.22,.82,.22,1.7],[255,196,107,.20,.70,.85,3.1],[124,92,255,.14,.18,.80,4.4],[34,197,94,.10,.48,.50,5.6]];
    function blobs(list,t,R,amp){ list.forEach(function(o){ var x=W*(o[4]+amp*Math.sin(t/9+o[6])), y=H*(o[5]+amp*1.2*Math.cos(t/11+o[6])), g=ctx.createRadialGradient(x,y,0,x,y,R);
      g.addColorStop(0,'rgba('+o[0]+','+o[1]+','+o[2]+','+o[3]+')'); g.addColorStop(1,'rgba('+o[0]+','+o[1]+','+o[2]+',0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }); }
    function draw(step){
      ctx.clearRect(0,0,W,H); var light=document.documentElement.getAttribute('data-theme')==='light', t=(Date.now()-T0)/1000, R=Math.max(W,H)*.45;
      if(light){
        blobs(ORBS,t,R,.08);
        bokeh.forEach(function(b){ if(step){ b.y-=b.v; b.x+=Math.sin(t/4+b.p)*.15; if(b.y<-b.r){ b.y=H+b.r; b.x=rnd(0,W);} }
          var g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r); g.addColorStop(0,'rgba('+b.c+','+(b.a*1.4)+')'); g.addColorStop(1,'rgba('+b.c+',0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.fill(); });
        dust.forEach(function(p){ if(step){ p.y-=p.v; p.x+=p.d; if(p.y<-4){ p.y=H+4; p.x=rnd(0,W);} } ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fillStyle='rgba(37,99,235,'+(p.a*.35)+')'; ctx.fill(); });
        return; }
      blobs(AUR,t,R*.9,.1);
      stars.forEach(function(s){ var a=.35+.65*Math.abs(Math.sin(t*s.s+s.p)); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fillStyle='rgba(200,225,255,'+a+')'; ctx.fill(); });
      dust.forEach(function(p){ if(step){ p.y-=p.v; p.x+=p.d; if(p.y<-4){ p.y=H+4; p.x=rnd(0,W);} } ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fillStyle='rgba(94,231,255,'+p.a+')'; ctx.fill(); });
      if(step&&t>nextMeteor){ meteors.push({x:rnd(W*.2,W*1.1),y:rnd(-40,H*.35),v:rnd(9,15),l:rnd(120,240),life:1}); nextMeteor=t+rnd(1.6,4.2); }
      meteors=meteors.filter(function(m){ return m.life>0; });
      meteors.forEach(function(m){ if(step){ m.x-=m.v; m.y+=m.v*.55; m.life-=.012; }
        var g=ctx.createLinearGradient(m.x,m.y,m.x+m.l,m.y-m.l*.55); g.addColorStop(0,'rgba(255,255,255,'+(.9*m.life)+')'); g.addColorStop(.3,'rgba(94,231,255,'+(.5*m.life)+')'); g.addColorStop(1,'rgba(94,231,255,0)');
        ctx.strokeStyle=g; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(m.x+m.l,m.y-m.l*.55); ctx.stroke(); });
    }
    size(); window.__skyDraw=function(){ draw(false); }; addEventListener('resize',function(){ size(); draw(false); });
    if(RM){ draw(false); return; }
    (function loop(){ draw(true); requestAnimationFrame(loop); })();
  })();
})();
